<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonic Kerst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="view" width="960" height="540"></canvas>

    <!-- Start, winst en game-over delen dit scherm. -->
    <div id="screen">
      <div id="card" class="mode-title">
        <p id="eyebrow">Green Hill · Kersteditie</p>
        <h1><span id="h-main">SONIC</span> <span id="h-sub">KERST</span></h1>
        <p id="lede">Pak ringen — die vangen een klap op — en haal de finish.</p>
        <button id="play" type="button">Start</button>
        <p id="help">Pijltjes of A/D rennen · spatie of W springen · 3 levens</p>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
